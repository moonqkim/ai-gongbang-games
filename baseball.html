    ctx.fillText('아야!', P.head[0] - 78, P.head[1] + 12);              // 머리 왼쪽 옆 (결과 띠에 가리지 않게)
  }
  // 뒤 팔 → 배트 → 앞 팔 (손이 배트를 감싸 쥐도록)
  limb(P.rs, P.re, 13, color); limb(P.re, P.hd, 11, SKIN);
  drawBat(P.hd[0], P.hd[1], P.ba, P.bl);
  limb(P.fs, P.fe, 13, color); limb(P.fe, P.hd, 11, SKIN);
  // 타격 장갑 (두 손)
  ctx.fillStyle = '#fafafa'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2;
  [[0, 0, 7.5], [Math.cos(P.ba) * 9, Math.sin(P.ba) * 9, 7]].forEach(([dx, dy, r]) => {
    ctx.beginPath(); ctx.arc(P.hd[0] + dx, P.hd[1] + dy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  });
  ctx.restore();
}
// 데드볼: 몸에 맞은 공이 땅으로 튀어 나감
function drawHbpBall(now) {
  if (hbpAt === null || phase !== 'result') return;
  const q = (now - hbpAt) / 600;
  if (q > 1) return;
  const x = target.x - 70 * q, y = lerp(target.y, 520, q) - Math.sin(q * Math.PI) * 40;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 9 - 3 * q, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (q < 0.3) {                                                          // 퍽! 충격선
    ctx.strokeStyle = '#ffdd33'; ctx.lineWidth = 3;
    for (let a = 0; a < 6; a++) {
      const ang = a * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(target.x + Math.cos(ang) * 14, target.y + Math.sin(ang) * 14);
      ctx.lineTo(target.x + Math.cos(ang) * 26, target.y + Math.sin(ang) * 26); ctx.stroke();
    }
  }
}
function drawPitchBall(now) {
  if (phase !== 'pitching') return;
  const t = Math.min((now - pitchStart) / pitch.ms, 1);
  if (t >= 1) return;
  const b = ballPosition(pitch, target, t, pitchSeed);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
}

// 친 공: 그림자 + 공(땅볼은 실밥이 돌며 굴러감) + 떨어질 때 흙먼지
function drawPlayBall(now, shadowOnly) {
  if (!play || phase !== 'result') return;
  const t = now - play.start;
  play.puffs.forEach(p => {
    const q = (t - p.t) / 500;
    if (shadowOnly || q < 0 || q > 1) return;
    const s = proj(p.X, p.Y);
    ctx.fillStyle = `rgba(200,170,130,${0.6 * (1 - q)})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, (4 + 14 * q) * s.sc * 2, (2 + 5 * q) * s.sc * 2, 0, 0, Math.PI * 2); ctx.fill();
  });
  const b = ballAt(play, t);
  if (!b) return;
  const g = proj(b.X, b.Y, 0), s = proj(b.X, b.Y, b.Z);
  if (shadowOnly) {
    const a = Math.max(0.1, 0.45 - b.Z * 0.004);
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, Math.max(3.5 * g.sc, 2) + b.Z * 0.01, Math.max(1.4 * g.sc, 1), 0, 0, Math.PI * 2); ctx.fill();
    return;
  }
  let x = s.x, y = s.y, rad = Math.max(3.6 * s.sc, 2.5) + b.Z * 0.012;
  if (t < 160) { const q = t / 160; x = lerp(target.x, x, q); y = lerp(target.y, y, q); rad = lerp(14, rad, q); }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (b.type === 'ground' || b.type === 'roll') {                       // 굴러가는 실밥
    ctx.strokeStyle = '#d23'; ctx.lineWidth = Math.max(1, rad * 0.3);
    ctx.beginPath(); ctx.arc(x, y, rad * 0.6, b.spin, b.spin + 1.6); ctx.stroke();
  }
}

// ═════════════════════════════════════════════
// 점수판 · ABS · 안내
// ═════════════════════════════════════════════
function shownGame(now) { return play && phase === 'result' && now < revealAt ? play.prev : game; }
function drawScoreboard(now) {
  const g = shownGame(now);
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(-90, 440, 225, 112);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${g.inning}회 ${g.top ? '초' : '말'}  공격: ${teamName(attackTeam(g))}`, -80, 465);
  ctx.fillText(`${teamName('A')} ${g.score.A}  :  ${g.score.B} ${teamName('B')}`, -80, 491);
  ctx.font = '16px sans-serif';
  ctx.fillText(`볼 ${'●'.repeat(g.balls)}${'○'.repeat(3 - g.balls)}`, -80, 516);
  ctx.fillText(`스트 ${'●'.repeat(g.strikes)}${'○'.repeat(2 - g.strikes)}`, 16, 516);
  ctx.fillText(`아웃 ${'●'.repeat(g.outs)}${'○'.repeat(2 - g.outs)}`, -80, 540);
  const base = (x, y, on) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = on ? '#ffcc00' : 'rgba(255,255,255,.3)'; ctx.fillRect(-10, -10, 20, 20); ctx.restore();
  };
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(772, 462, 120, 90);
  base(862, 512, g.bases[0]); base(832, 484, g.bases[1]); base(802, 512, g.bases[2]);
}
const ABS_BOX = { x: 772, y: 245, w: 120, h: 210 };
const ABS_MAP = { x: ABS_BOX.x + 10, y: ABS_BOX.y + 30, k: 100 / AIM_AREA.w };
const absMap = p => ({ x: ABS_MAP.x + (p.x - AIM_AREA.x) * ABS_MAP.k, y: ABS_MAP.y + (p.y - AIM_AREA.y) * ABS_MAP.k });
const CALL = { buntfoul: ['번트 파울', '#ffcc00'], sacbunt: ['번트', '#ffffff'], buntsingle: ['번트', '#ffffff'], buntpop: ['번트', '#ffffff'], hbp: ['데드볼', '#ff9f43'], strike: ['스트라이크', '#ff5b5b'], ball: ['볼', '#5bd75b'], miss: ['헛스윙', '#ff5b5b'], foul: ['파울', '#ffcc00'] };
function drawAbs() {
  if (abs.length === 0 || phase === 'cover') return;
  const b = ABS_BOX;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#7fd4ff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🤖 ABS', b.x + b.w / 2, b.y + 20);
  const z1 = absMap(ZONE), z2 = absMap({ x: ZONE.x + ZONE.w, y: ZONE.y + ZONE.h });
  const zw = z2.x - z1.x, zh = z2.y - z1.y;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(z1.x + zw * i / 3, z1.y); ctx.lineTo(z1.x + zw * i / 3, z2.y);
    ctx.moveTo(z1.x, z1.y + zh * i / 3); ctx.lineTo(z2.x, z1.y + zh * i / 3); ctx.stroke();
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(z1.x, z1.y, zw, zh);
  abs.forEach((a, i) => {
    const m = absMap(a);
    ctx.fillStyle = a.inZone ? '#ff5b5b' : '#5bd75b';
    ctx.beginPath(); ctx.arc(m.x, m.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif'; ctx.fillText(String(i + 1), m.x, m.y + 4);
  });
  const last = abs[abs.length - 1];
  const [label, color] = CALL[last.result] || ['타격', '#ffffff'];
  ctx.fillStyle = color; ctx.font = 'bold 17px sans-serif'; ctx.fillText(label, b.x + b.w / 2, b.y + b.h - 30);
  ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.fillText(`${last.name} ${last.kmh}km/h`, b.x + b.w / 2, b.y + b.h - 10);
}
// 스윙 정확도판: 왼쪽, 점수판 위. 휘두른 순간부터 다음 투구 전까지
const TIMING_BOX = { x: -90, y: 252, w: 225, h: 128 };
// 번트 버튼: 점수판 바로 위. 가림 화면이 걷힌 뒤 보임. 한 번 누르면 번트 자세, 한 번 더 누르면 빼기
const BUNT_BTN = { x: -90, y: 388, w: 225, h: 46 };
function drawBuntButton(now) {
  if (mode === null || isAi(attTeam())) return;
  const batterTurn = ['ready', 'pitching', 'result'].includes(phase);   // 가림 화면에서는 보이지 않음
  if (!batterTurn) return;
  const b = BUNT_BTN, live = buntAllowed(), on = buntOn;
  ctx.fillStyle = on ? '#ffd166' : live ? 'rgba(255,255,255,.92)' : 'rgba(0,0,0,.55)';
  ctx.strokeStyle = on ? '#fff' : live ? '#ffd166' : 'rgba(255,255,255,.3)'; ctx.lineWidth = on || live ? 3 : 2;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = on || live ? '#222' : 'rgba(255,255,255,.6)'; ctx.textAlign = 'center';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(on ? '🏏 번트 자세!' : '🏏 번트', b.x + b.w / 2, b.y + 22);
  ctx.font = '12px sans-serif';
  ctx.fillText(on ? (live ? '한 번 더 누르면 배트를 빼요' : '배트를 공에 댑니다')
                  : (live ? '누르면 번트 자세 · 한 번 더 누르면 빼기' : '타자 차례에 누를 수 있어요'), b.x + b.w / 2, b.y + 39);
}
function drawTiming() {
  if (swingAt === null || !pitch || !(phase === 'pitching' || phase === 'result')) return;
  const g = timingGrade(swingAt - pitch.ms), b = TIMING_BOX, cx = b.x + b.w / 2;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 15px sans-serif'; ctx.fillText('🎯 스윙 정확도', cx, b.y + 20);
  const st = styles[attTeam()];
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '12px sans-serif';
  ctx.fillText(`${SWING_TYPES[st.swing]} · ${HIT_DIRS[st.dir]}`, cx, b.y + b.h - 6);
  ctx.fillStyle = g.color; ctx.font = 'bold 30px sans-serif'; ctx.fillText(g.label, cx, b.y + 56);
  // 다섯 칸 막대 (빠름 ← 좋음 → 늦음)
  const bx = b.x + 12, bw = b.w - 24, by = b.y + 76;
  const cuts = [-150, -90, -35, 35, 90, 150];
  for (let i = 0; i < 5; i++) {
    const x0 = bx + bw * (cuts[i] + 150) / 300, x1 = bx + bw * (cuts[i + 1] + 150) / 300;
    ctx.fillStyle = TIMING_GRADES[i].color; ctx.globalAlpha = TIMING_GRADES[i].label === g.label ? 1 : 0.3;
    ctx.fillRect(x0 + 1, by, x1 - x0 - 2, 10);
  }
  ctx.globalAlpha = 1;
  const mx = bx + bw * g.pos;                                                // 내가 휘두른 위치 ▼
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - 6, by - 9); ctx.lineTo(mx + 6, by - 9); ctx.lineTo(mx, by - 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '11px sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('빠름', bx, by + 26);
  ctx.textAlign = 'right'; ctx.fillText('늦음', bx + bw, by + 26);
}

// 스윙 측정판: ABS 판 바로 위
const METER_BOX = { x: 772, y: 118, w: 120, h: 120 };
function drawMeter() {
  if (!meter || phase === 'cover') return;
  const b = METER_BOX, cx = b.x + b.w / 2;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('⚡ 스윙 측정', cx, b.y + 18);
  const row = (label, value, unit, color, frac, y) => {
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(label, b.x + 8, y);
    ctx.textAlign = 'right'; ctx.fillStyle = color; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(value, b.x + b.w - (unit ? 34 : 8), y + 20);
    if (unit) { ctx.font = '11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(unit, b.x + b.w - 8, y + 20); }
    if (frac !== null) {                                                     // 막대 게이지
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(b.x + 8, y + 26, b.w - 16, 4);
      ctx.fillStyle = color; ctx.fillRect(b.x + 8, y + 26, (b.w - 16) * clamp01(frac), 4);
    }
  };
  if (!meter.swung) {
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(meter.bunt ? '🏏 번트' : '스윙 없음', cx, b.y + 68);
    return;
  }
  row('스윙 속도', meter.swing, 'km/h', '#7fd4ff', (meter.swing - 90) / 50, b.y + 40);
  if (meter.exit === null) row('타구 속도', '헛스윙', '', '#ff5b5b', null, b.y + 82);
  else row('타구 속도', meter.exit, 'km/h', meter.exit >= 160 ? '#ff9f43' : '#7dff9a', (meter.exit - 80) / 110, b.y + 82);
}

function drawOverlay(now) {
  ctx.textAlign = 'center';
  if (phase === 'cover') {
    ctx.fillStyle = 'rgba(10,30,10,.92)'; ctx.fillRect(-VIEW.x, -VIEW.y, 1000, 780);
    ctx.fillStyle = '#fff';
    coverText.forEach((line, i) => { ctx.font = i === 0 ? 'bold 40px sans-serif' : '26px sans-serif'; ctx.fillText(line, 400, 230 + i * 55); });
  } else if (phase === 'ready') {
    ctx.fillStyle = '#ffdd33'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('플레이볼!', 400, 310);
  } else if (phase === 'result' && now >= revealAt) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(200, 280, 400, 70);
    ctx.fillStyle = '#ffdd33'; ctx.font = 'bold 40px sans-serif'; ctx.fillText(resultText, 400, 330);
  }
}

// ═════════════════════════════════════════════
// 매 프레임
// ═════════════════════════════════════════════
function loop(now) {
  if (phase === 'pitching') {
    const elapsed = now - pitchStart;
    if (aiSwingAt !== null && swingAt === null && elapsed >= aiSwingAt) { swingAt = aiSwingAt; swingAnimStart = now; swingSound(); }
    if (aiBunt && !buntOn && elapsed >= pitch.ms * 0.45) { buntOn = true; buntAt = now; }   // AI 번트 자세
    if (buntOn && elapsed >= pitch.ms) { finishPitch(now); }                // 번트는 공이 닿는 순간 결과
    else {
    const contact = swingAt !== null && judgeSwing(swingAt - pitch.ms, absInZone(target)) !== 'miss';
    if (contact && elapsed >= Math.max(swingAt, pitch.ms)) finishPitch(now);      // 맞는 순간 바로 타구로
    else if (swingAt === null && isHitByPitch(target) && elapsed >= pitch.ms) finishPitch(now);   // 데드볼
    else if (elapsed >= pitch.ms + SWING_WINDOW) finishPitch(now);
    }
  }
  if (phase === 'result' && now >= resultEnd) {
    if (play && play.after) { const next = play.after; play = null; playTeams = null; next(); }   // 견제 뒤 이어서
    else startPitchTurn();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(GROUND, 0, 0);
  ctx.setTransform(1, 0, 0, 1, VIEW.x, VIEW.y);
  drawHomeArea();
  drawPlayBall(now, true);
  drawFieldPeople(now);
  drawPlayBall(now, false);
  drawZone(); drawCatcherBody(); drawCatcher(now);
  drawPitchBall(now); drawBatter(now); drawHbpBall(now);
  drawScoreboard(now); drawBuntButton(now); drawTiming(); drawMeter(); drawAbs(); drawOverlay(now);
  requestAnimationFrame(loop);
}
guide.textContent = '누구랑 할지 고르세요';
requestAnimationFrame(loop);
</script>
